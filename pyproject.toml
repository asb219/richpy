[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "richpy"
version = "0.1.0"
description = "Query the Radiocarbon Inventories of Switzerland database"
authors = [{name="Alexander S. Brunmayr", email="abrunmayr@ethz.ch"}]
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.8"
dependencies = [
    "requests",
    "pandas"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://rich.ethz.ch"
GitHub = "https://github.com/asb219/richpy"
